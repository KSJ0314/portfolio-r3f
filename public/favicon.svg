<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- 종이 밑에 깔리는 그림자 -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000" flood-opacity="0.22"/>
    </filter>

    <!-- 모눈·획이 종이 밖으로 나가지 않게 -->
    <clipPath id="paper">
      <rect x="5" y="5" width="54" height="54" rx="8"/>
    </clipPath>
  </defs>

  <!-- 오려 붙인 종이 한 장. 테두리는 바닥과 같은 종이색이라 그림자로만 떠 보인다 -->
  <g filter="url(#drop)">
    <rect x="5" y="5" width="54" height="54" rx="8" fill="#fffefc"
          stroke="#f2efe9" stroke-width="2"/>
  </g>

  <g clip-path="url(#paper)">
    <!-- 모눈 -->
    <g stroke="#e0e0e0" stroke-width="2">
      <path d="M23 5V59M41 5V59M5 23H59M5 41H59"/>
    </g>

    <!-- 크레파스 획 -->
    <path d="M14 45C23 27 35 18 50 17"
          fill="none" stroke="#55bcf0" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
