<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 손글씨 폰트(감자꽃). 직접 호스팅하며, 유니코드 범위별로 쪼개져 있어 쓰는 글자만 받아 온다. -->
    <link rel="stylesheet" href="/fonts/gamja-flower/gamja-flower.css" />
    <title>3D Portfolio: SoJung Kim</title>
    <meta
      name="description"
      content="ThreeJS로 만든 3D 인터랙티브 포트폴리오. 프론트엔드 개발자 김소중을 소개하는 사이트입니다."
    />
    <!-- 모든 경로가 같은 문서를 받으므로 색인은 대표 주소 하나로 모은다. -->
    <link rel="canonical" href="https://kimsojung-portfolio.vercel.app/" />
    <!-- Search Console 소유권 확인. 지우면 확인이 풀린다. -->
    <meta
      name="google-site-verification"
      content="sR4upVnXDm4v9VXELrAjNiKaOLfIoEa6q5fSc0R_hHc"
    />

    <!-- 링크 공유 카드(Open Graph). 크롤러는 상대 경로를 읽지 못해 주소를 절대 경로로 둔다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3D Portfolio: SoJung Kim" />
    <meta property="og:url" content="https://kimsojung-portfolio.vercel.app/" />
    <meta property="og:title" content="3D Portfolio: SoJung Kim" />
    <meta
      property="og:description"
      content="ThreeJS로 만든 3D 인터랙티브 포트폴리오. 프론트엔드 개발자 김소중을 소개하는 사이트입니다."
    />
    <meta
      property="og:image"
      content="https://kimsojung-portfolio.vercel.app/images/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- 내용이 WebGL 캔버스 안에 있어 검색엔진이 읽을 글이 없다. 소개를 여기에 따로 둔다. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "김소중",
        "alternateName": "SoJung Kim",
        "jobTitle": "프론트엔드 개발자",
        "url": "https://kimsojung-portfolio.vercel.app/",
        "sameAs": ["https://github.com/KSJ0314"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
